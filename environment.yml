# Conda environment with the package versions used for the results of the paper.
#   conda env create -f environment.yml
#   conda activate pisasr
# Gurobi needs a license (free academic licenses: https://www.gurobi.com/academia/).
name: pisasr
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - numpy=2.4.6
  - pandas=3.0.3
  - scipy=1.17.1
  - scikit-learn=1.9.0
  - pyomo=6.10.0
  - openpyxl=3.1.5
  - matplotlib=3.10.9
  - pytest=7.2.2
  - pip
  - pip:
      - gurobipy==13.0.2
      - -e .
